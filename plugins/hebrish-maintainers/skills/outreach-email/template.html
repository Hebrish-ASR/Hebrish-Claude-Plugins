<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{{subject}}</title></head>
<body style="margin:0;padding:0;background:{{c.bg}};">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{c.bg}};"><tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:{{c.surface}};border-radius:12px;overflow:hidden;border:1px solid {{c.line}};">
{{header}}    <tr><td style="padding:{{body_top}}px 40px 8px;font-family:{{font}};color:{{c.ink}};">
      <p style="margin:0 0 16px;font-size:16px;line-height:1.65;color:{{c.ink}};">{{greeting}}</p>
      {{paragraphs}}
      <p style="margin:24px 0 0;font-size:16px;line-height:1.6;color:{{c.ink}};">{{signoff}}<br>{{signoff_name}}</p>
    </td></tr>
    <tr><td style="padding:28px 40px 28px;font-family:{{font}};">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid {{c.line}};width:100%;"><tr><td style="padding-top:22px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
{{sig_photo_cell}}          <td valign="middle" style="font-family:{{font}};border-left:3px solid {{c.accent}};padding-left:16px;">
            <p style="margin:0;font-size:17px;font-weight:700;color:{{c.ink}};">{{sig.name}}</p>
            {{sig_subline}}
            {{sig_links}}
          </td>
        </tr></table>
      </td></tr></table>
    </td></tr>{{links_box}}{{footer}}
  </table>
</td></tr></table>
</body></html>
